name: Release

# Tagging `vX.Y.Z` is the only way artifacts become downloadable. The installer
# consumes the manifest attached here and never builds from a branch.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to dry-run, e.g. v0.2.0 (builds and verifies, publishes nothing)"
        required: true

permissions:
  contents: write
  id-token: write # keyless Sigstore signing for build provenance
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # A dry run builds, verifies and produces a manifest, but skips every
      # publishing step, so the release path can be exercised before tagging.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
      STAGE: dist/release
    steps:
      # Fail before anything ships. Each publish step below warns and skips when
      # its token is missing, so a release that lost a secret — a repo transfer
      # is how that happens — finishes green having published nothing, and
      # cannot simply be re-run: the GitHub Release already exists and
      # `gh release create` refuses a tag that has one. Checking here, before
      # the tag becomes a Release, makes that failure cost nothing.
      #
      # Presence is all this can check. An expired VSCE_PAT (Azure PATs cap at a
      # year) still passes here and fails at the Marketplace step.
      #
      # Set repository variable ALLOW_PARTIAL_RELEASE=true to release without
      # one, which is the pre-token behaviour this replaces.
      - name: Preflight — registry tokens present
        if: env.DRY_RUN == 'false' && vars.ALLOW_PARTIAL_RELEASE != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          missing=()
          for name in NPM_TOKEN VSCE_PAT OVSX_PAT; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::${TAG} would publish nothing to ${missing[*]} — repository secrets are missing. Secrets are per-repo and do not always survive a transfer: check Settings > Secrets and variables > Actions on ${REPO}. To release anyway, set repository variable ALLOW_PARTIAL_RELEASE=true."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches root engines.node; the manifest's minNode
          cache: npm
          registry-url: https://registry.npmjs.org # writes the .npmrc NODE_AUTH_TOKEN needs

      - run: npm ci

      # The hand-written half of the notes, from the CHANGELOG.md section that
      # names this tag. Checked here, before anything is built or published, so
      # a tag whose notes were never written fails at no cost. The merged-PR
      # list that --generate-notes produces is appended underneath at release
      # time; it names pull requests, this says what changed.
      - name: Release notes
        run: node scripts/release-notes.mjs --tag "$TAG" --out dist/release-notes.md

      # One tag, one version across every artifact, so the manifest carries a
      # single `version` and the installer never reasons about per-package skew.
      - name: Stamp release version
        run: node scripts/stamp-version.mjs --tag "$TAG"

      # The release gate: DRY guard rail, full dependency-ordered build, and
      # every workspace test suite. A red verify means no release.
      - name: Verify
        run: npm run verify

      - name: Package extension VSIX
        run: npm run package

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p "$STAGE"
          # VSIX keeps the name vsce generates (it already carries the version).
          # One extension, one VSIX, published to both the VS Code Marketplace
          # and Open VSX — Cursor installs the same file from Open VSX.
          mv ascenda-vscode-extension-telemetry/*.vsix "$STAGE/"
          # Every CLI bundles to dist/cli.js, so each is staged under its own
          # self-describing name. Derived from RELEASE_PACKAGES rather than
          # listed here: a second hand-maintained copy of that list is how
          # @ascenda-one/history-import shipped for a release cycle without
          # ever being published.
          node -e 'import("./scripts/release-artifacts.mjs").then(({ RELEASE_PACKAGES }) =>
            console.log(RELEASE_PACKAGES.filter((p) => p.kind === "cli").map((p) => `${p.dir} ${p.name}`).join("\n")))' \
          | while read -r dir name; do
              [ -n "$dir" ] || continue
              cp "$dir/dist/cli.js" "$STAGE/$name.mjs"
            done
          ls -l "$STAGE"

      - name: Build manifest
        run: node scripts/release-manifest.mjs --tag "$TAG" --dir "$STAGE" --repo "$REPO"

      # Keyless Sigstore provenance over the artifacts and the manifest itself.
      # Verified by consumers with: gh attestation verify <file> --repo <owner/name>
      - name: Attest build provenance
        if: env.DRY_RUN == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "${{ env.STAGE }}/*"

      - name: Upload dry-run artifacts
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ github.event.inputs.tag }}
          path: ${{ env.STAGE }}/

      # `latest` pointer: GitHub serves the newest release's assets at the
      # stable URL .../releases/latest/download/manifest.json — no extra infra.
      - name: Publish GitHub Release
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "$STAGE"/* --notes-file dist/release-notes.md --generate-notes --verify-tag

      # --- npm publishing ---------------------------------------------------
      # Publishing the hook CLIs makes `npx @ascenda-one/codex-hooks` work with
      # no download step, and proves the path installer M2's @ascenda-one/cli
      # will land on. --provenance ties them to the same Sigstore chain as the
      # release assets. Skips cleanly until NPM_TOKEN exists.
      - name: Publish CLIs to npm
        if: env.DRY_RUN == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN not set — skipping npm publish (artifacts are attached to the release)."
            exit 0
          fi
          node -e 'import("./scripts/release-artifacts.mjs").then(({ RELEASE_PACKAGES }) =>
            console.log(RELEASE_PACKAGES.filter((p) => p.npm).map((p) => p.dir).join("\n")))' \
          | while read -r dir; do
              [ -n "$dir" ] || continue
              echo "publishing $dir"
              npm publish --workspace "$dir" --provenance --access public
            done

      # --- Marketplace publishing -------------------------------------------
      # Both steps no-op until the publisher accounts exist and the tokens are
      # added as repository secrets. VSIX-from-release stays the universal
      # fallback either way, so a missing token never fails a release.
      #
      # One identity, ascenda-one.ascenda, published as the same VSIX to both
      # registries — Cursor installs from Open VSX under this same identity,
      # via runtime host detection, not a second extension.
      - name: Publish to VS Code Marketplace
        if: env.DRY_RUN == 'false'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::warning::VSCE_PAT not set — skipping Marketplace publish (VSIX is attached to the release)."
            exit 0
          fi
          npx vsce publish --no-dependencies --packagePath "$STAGE"/ascenda-*.vsix

      - name: Publish to OpenVSX
        if: env.DRY_RUN == 'false'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::warning::OVSX_PAT not set — skipping OpenVSX publish (VSIX is attached to the release)."
            exit 0
          fi
          npx ovsx publish "$STAGE"/ascenda-*.vsix -p "$OVSX_PAT"
